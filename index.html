<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>무념무상</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="무념무상">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f2f3f5; --card:#ffffff; --card2:#f7f8fa; --ink:#2c2e35; --muted:#8a8d97; --line:#e4e6eb;
    /* 파스텔 무지개 (p: 배경용, d: 글자·막대용 진한 톤) */
    --p1:#f6c1c1; --p2:#f8d4b4; --p3:#f4e6a8; --p4:#c4e5cd; --p5:#bcd8f1; --p6:#cbcdf3; --p7:#e0cdef;
    --d1:#d77d7d; --d2:#d9975f; --d3:#c5a43f; --d4:#5ea978; --d5:#5d95c8; --d6:#7378cf; --d7:#a57fc6;
    --rainbow:linear-gradient(90deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7));
    --felt:#6b70c8; --felt2:#4f55a8; --accent:var(--d7); --danger:#cf5f59;
    --shadow:0 2px 10px rgba(30,35,55,.06);
    --navh:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
  body{padding:0 0 calc(var(--navh) + 24px + env(safe-area-inset-bottom));}
  body.noscroll{overflow:hidden}
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px}
  .jua{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400}

  /* header */
  header.top{background:var(--card);color:var(--ink);padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:relative;box-shadow:var(--shadow)}
  header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rainbow)}
  header.top .wrap{display:flex;align-items:center;gap:10px}
  header.top .logo{width:42px;height:42px;flex:none;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  header.top h1{margin:0;font-size:22px;letter-spacing:.3px}
  header.top .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  header.top .grow{flex:1;min-width:0}
  .syncpill{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;
    padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
  .syncpill.err{background:#fbe3e2;border-color:#f3c7c5;color:var(--danger)}
  .syncpill.off{color:var(--muted)}

  /* bottom nav */
  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(30,35,55,.05)}
  nav.bottom .wrap{display:flex;height:var(--navh)}
  nav.bottom button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
  nav.bottom button .ic{font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}
  nav.bottom button.on{color:var(--felt)}
  nav.bottom button.on .ic{filter:none;opacity:1}

  .fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom));z-index:41;
    border:none;border-radius:999px;background:#bfdcf3;color:#24425e;padding:14px 22px;font-size:16px;font-weight:800;
    box-shadow:0 6px 18px rgba(93,149,200,.30)}
  .fab:active{transform:scale(.97)}

  /* generic */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .sec-title{font-family:"Jua",sans-serif;font-size:18px;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
  .sec-title .r{margin-left:auto;font-family:"Noto Sans KR",sans-serif;font-size:12.5px;color:var(--muted);font-weight:500}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--p6);border-color:var(--p6);color:#2c2f66}
  .btn.accent{background:var(--p7);border-color:var(--p7);color:#4a2f63}
  .btn.danger{color:var(--danger);border-color:#f1d0ce;background:#fff}
  .btn.danger.fill{background:var(--danger);color:#fff;border-color:var(--danger)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .empty .big{font-size:42px;margin-bottom:8px}
  input[type=text],input[type=date],input[type=search],textarea,select{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--felt)}
  textarea{resize:vertical;min-height:76px;line-height:1.5}

  /* list filters */
  .filters{padding:14px 0 4px;display:flex;flex-direction:column;gap:8px}
  .seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;border:none;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13.5px;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .frow{display:flex;gap:8px}
  .frow select{width:auto;flex:none}
  .exfilter{display:flex;align-items:center;gap:8px;background:#f0f1fc;border:1px solid #dadcf5;border-radius:12px;padding:8px 12px;font-size:13.5px}
  .exfilter b{flex:1}
  .exfilter button{border:none;background:none;color:var(--felt);font-weight:800}

  .month{font-size:13px;font-weight:800;color:var(--muted);margin:18px 4px 8px;display:flex;justify-content:space-between}
  .rec{display:flex;gap:12px;padding:12px;margin-bottom:10px;cursor:pointer;align-items:stretch}
  .rec:active{transform:scale(.995)}
  .rec .dt{flex:none;width:52px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line)}
  .rec .dt .d{font-family:"Jua",sans-serif;font-size:22px;line-height:1}
  .rec .dt .w{font-size:11.5px;color:var(--muted);margin-top:3px}
  .rec .dt.sun .w{color:var(--d1)}.rec .dt.sat .w{color:var(--d5)}
  .rec .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .rec .t1{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
  .rec .t1 .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{flex:none;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;color:#2e5a3d;background:var(--p4)}
  .badge.sp{background:var(--p7);color:#4a2f63}
  .rec .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
  .mini{display:flex;flex-wrap:wrap;gap:4px}
  .mini span{font-size:12px;background:#e7f4eb;color:#3f8659;border-radius:6px;padding:2px 7px;font-weight:700}
  .mini span.more{background:var(--card2);color:var(--muted)}
  .rec.special{border-left:4px solid var(--p7)}

  /* chips / pickers */
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{--k:var(--p6);--kd:var(--d6);display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;font-size:14px;font-weight:600;user-select:none;-webkit-user-select:none;line-height:1.2}
  .chip.on{background:var(--k);border-color:var(--k);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .chip.add{border-style:dashed;color:var(--muted);background:transparent}
  .chip.sug{font-size:13px;padding:5px 10px;background:var(--card2);font-weight:500}
  .chip.sug small{color:var(--muted);font-size:11px}
  .chip.hiddenTag{opacity:.6}
  .k-members{--k:var(--p5);--kd:var(--d5)} .k-games{--k:var(--p4);--kd:var(--d4)} .k-areas{--k:var(--p2);--kd:var(--d2)} .k-foods{--k:var(--p1);--kd:var(--d1)}
  .addbox{display:flex;gap:6px;width:100%;margin-top:2px}
  .addbox input{flex:1;padding:8px 12px}
  .addbox button{flex:none}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(30,33,42,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.show{display:flex}
  #formM{z-index:60}
  #dlgM{z-index:90;align-items:center;padding:20px}
  .sheet{background:var(--card);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;
    box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .22s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  @media (min-width:700px){ .modal{align-items:center;padding:20px} .sheet{border-radius:22px;max-height:90vh} }
  .sh{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  .sh h2{margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xbtn{border:none;background:var(--card2);width:34px;height:34px;border-radius:50%;font-size:17px;flex:none;color:var(--muted)}
  .sb{padding:6px 16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
  .sf{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .sf .btn{flex:1;padding:13px}
  .sf .btn.del{flex:none}

  .fld{margin-top:16px}
  .fld>label,.fld>.lb{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;margin-bottom:7px}
  .fld>.lb .r{margin-left:auto;font-weight:600;font-size:12.5px;color:var(--muted)}
  .sub-lb{font-size:12.5px;color:var(--muted);margin:10px 0 6px;font-weight:600}
  .stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .stepper button{border:none;background:none;width:38px;height:36px;font-size:18px;font-weight:800;color:var(--felt)}
  .stepper span{min-width:30px;text-align:center;font-weight:800}
  .total{font-weight:800;color:var(--felt)}
  .group{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:6px}
  .memory-box textarea{background:#fefbec;border-color:#efe2a8}

  /* photos */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .ph{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--card2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);text-align:center;padding:0}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph.loading::after{content:"";width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--felt);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ph .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:14px;z-index:2}
  .ph .cover{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;border-radius:6px;padding:1px 6px;z-index:2}
  .ph.addp{border-style:dashed;flex-direction:column;gap:2px;font-size:12.5px;font-weight:700;cursor:pointer}
  .ph.addp .p{font-size:24px}

  /* detail */
  .dhead{padding:14px 0 4px}
  .dhead .when{color:var(--muted);font-size:13.5px;font-weight:600}
  .ditem{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .ditem:last-child{border-bottom:none}
  .ditem .ic{flex:none;width:28px;font-size:19px;text-align:center}
  .ditem .ct{flex:1;min-width:0}
  .ditem .lb{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .ditem .tx{white-space:pre-wrap;word-break:break-word}
  .memory{background:#fdf9e8;border:1px solid #efe2a8;border-radius:14px;padding:12px 14px;margin:10px 0;white-space:pre-wrap;word-break:break-word}
  .memory .lb{font-family:"Jua",sans-serif;color:#a88a2c;font-size:15px;margin-bottom:4px}

  /* viewer */
  #viewer{position:fixed;inset:0;background:#000;z-index:80;display:none;touch-action:none;user-select:none}
  #viewer.show{display:block}
  #viewer img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;object-fit:contain}
  #viewer .vbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    background:linear-gradient(rgba(0,0,0,.6),transparent);color:#fff;z-index:2}
  #viewer .vbar span{flex:1;font-weight:700}
  #viewer .vbtn{border:none;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px}
  #viewer .nav{position:absolute;top:50%;transform:translateY(-50%);border:none;background:rgba(255,255,255,.15);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;z-index:2}
  #viewer .nav.l{left:10px}#viewer .nav.r{right:10px}
  #viewer .vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa}

  /* dialog */
  .dlg{background:var(--card);border-radius:20px;max-width:400px;width:100%;padding:20px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .18s ease}
  .dlg h3{margin:0 0 8px;font-family:"Jua",sans-serif;font-weight:400;font-size:20px}
  .dlg .msg{white-space:pre-wrap;color:#4b4e57;font-size:14.5px}
  .dlg input{margin-top:12px}
  .dlg .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .dlg .btns.h{flex-direction:row}
  .dlg .btns .btn{flex:1;padding:12px}

  .toast{position:fixed;left:50%;bottom:calc(var(--navh) + 80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(44,46,53,.92);color:#fff;
    padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
  .toast.show{opacity:1}

  /* stats */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
  @media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{padding:14px 12px}
  .tile .n{font-family:"Jua",sans-serif;font-size:28px;line-height:1.1;color:var(--felt)}
  .tile{border-top:4px solid var(--p6)}
  .tile:nth-child(1){border-top-color:var(--p1)}.tile:nth-child(1) .n{color:var(--d1)}
  .tile:nth-child(2){border-top-color:var(--p7)}.tile:nth-child(2) .n{color:var(--d7)}
  .tile:nth-child(3){border-top-color:var(--p5)}.tile:nth-child(3) .n{color:var(--d5)}
  .tile:nth-child(4){border-top-color:var(--p4)}.tile:nth-child(4) .n{color:var(--d4)}
  .tile .n small{font-size:15px;color:var(--muted)}
  .tile .l{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
  .bars{padding:6px 12px}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 2px;cursor:pointer;border-bottom:1px solid #eef0f3}
  .bar:last-child{border-bottom:none}
  .bar .rk{width:20px;font-weight:800;color:var(--muted);font-size:13px;text-align:center;flex:none}
  .bar .nm{width:34%;flex:none;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .tr{flex:1;height:12px;border-radius:6px;background:#eceef2;overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--k,var(--p6)),var(--kd,var(--d6)))}
  .bar .ct{flex:none;font-size:12.5px;font-weight:700;color:var(--muted);min-width:54px;text-align:right}
  .more-btn{display:block;width:100%;border:none;background:none;color:var(--felt);font-weight:800;padding:10px;font-size:13.5px}
  details.grp{border-bottom:1px solid #eef0f3}
  details.grp:last-child{border-bottom:none}
  details.grp summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;font-weight:800}
  details.grp summary::-webkit-details-marker{display:none}
  details.grp summary .c{margin-left:auto;color:var(--muted);font-size:13px;font-weight:700}
  details.grp summary::before{content:"▸";color:var(--muted);transition:transform .15s}
  details.grp[open] summary::before{transform:rotate(90deg)}
  details.grp .items{padding:0 14px 10px 32px}
  details.grp .it{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;cursor:pointer;border-top:1px dashed #eceef2}
  details.grp .it span:last-child{color:var(--muted);font-weight:700;font-size:13px}
  .months{display:flex;align-items:flex-end;gap:4px;height:120px;padding:14px 12px 6px}
  .months .m{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
  .months .m i{display:block;width:100%;max-width:26px;background:var(--p6);border-radius:5px 5px 2px 2px;min-height:2px}
  .months .m:nth-child(7n+1) i{background:var(--p1)}.months .m:nth-child(7n+2) i{background:var(--p2)}.months .m:nth-child(7n+3) i{background:var(--p3)}
  .months .m:nth-child(7n+4) i{background:var(--p4)}.months .m:nth-child(7n+5) i{background:var(--p5)}.months .m:nth-child(7n+6) i{background:var(--p6)}.months .m:nth-child(7n) i{background:var(--p7)}
  .months .m i.z{background:#e7e9ee!important}
  .months .m b{font-size:11px;color:var(--ink)}
  .months .m span{font-size:10.5px;color:var(--muted)}
  .ychips{display:flex;gap:6px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
  .ychips::-webkit-scrollbar{display:none}
  .ychips .chip{flex:none}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;margin-top:8px}

  /* settings */
  .scard{padding:14px;margin-bottom:12px}
  .scard h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:6px}
  .scard p.d{margin:0 0 10px;color:var(--muted);font-size:13px}
  .taglist{list-style:none;margin:8px 0 0;padding:0}
  .taglist li{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #eef0f3;background:var(--card)}
  .taglist li:last-child{border-bottom:none}
  .taglist .handle{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#b3b6bf;fill:currentColor;font-size:18px;cursor:grab;touch-action:none;flex:none}
  .taglist .nm{flex:1;font-weight:700;border:none;background:none;text-align:left;padding:4px 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .taglist .cnt{font-size:12px;color:var(--muted);flex:none}

<script>
'use strict';
/* =========================================================
   설정
   ========================================================= */
const BAKED_CFG = {

  messagingSenderId: "479330060096",
  appId: "1:479330060096:web:f7026bdb82187dc1299ca5"
};
const COL = 'boardgame_sync';            // Firestore 컬렉션
const LS_STATE = 'bg_state_v1', LS_SYNC = 'bg_sync_id', LS_PUP = 'bg_photo_pending_up', LS_PDEL = 'bg_photo_pending_del';
const LS_VIEW = 'bg_view_cache', LS_ADMIN_HINT = 'bg_admin_hint';
const ADMIN_FIELD = 'boardgameAdmins';   // meta/allow 문서에 관리자 UID 배열
const MAX_PHOTOS = 5;                    // 기록당 사진 최대 장수
const PHOTO_EDGE = 1280;                 // 긴 변 최대 px
const PHOTO_MAX_CHARS = 420000;          // 사진 1장 최대 크기(약 0.42MB, Firestore 문서 1MB 제한 안쪽)
const FREE_BYTES = 1024 * 1024 * 1024;   // Firestore 무료 저장 1GiB
const KINDS = {
  members: { label: '멤버', icon: '👤', ph: '닉네임' },
  areas:   { label: '장소 (지역)', icon: '📍', ph: '예: 강남, 홍대' },
  games:   { label: '보드게임', icon: '🎲', ph: '게임 이름' },
  foods:   { label: '식사 종류', icon: '🍽️', ph: '예: 한식, 일식' }
};
const DEFAULT_FOODS = ['한식', '일식', '중식', '양식', '베트남식', '인도식', '분식', '패스트푸드', '고기', '술집', '카페', '기타'];
const WD = ['일', '월', '화', '수', '목', '금', '토'];

/* =========================================================
   유틸
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function getLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function setLS(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function delLS(k) { try { localStorage.removeItem(k); } catch (e) {} }
function getList(k) { try { const a = JSON.parse(getLS(k) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function setList(k, a) { setLS(k, JSON.stringify(Array.from(new Set(a)))); }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function wdOf(date) { const d = new Date(date + 'T00:00:00'); return isNaN(d) ? '' : WD[d.getDay()]; }
function wdIdx(date) { const d = new Date(date + 'T00:00:00'); return isNaN(d) ? -1 : d.getDay(); }
function fmtDate(date) { if (!date) return ''; const [y, m, d] = date.split('-'); return `${y}.${+m}.${+d} (${wdOf(date)})`; }
function fmtMB(b) { return b < 1024 * 1024 ? (b / 1024).toFixed(0) + 'KB' : (b / 1024 / 1024).toFixed(1) + 'MB'; }
function byteLen(s) { try { return new Blob([s]).size; } catch (e) { return s.length * 2; } }
function norm(s) { return String(s || '').trim().replace(/\s+/g, ' '); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
let toastT = 0;
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2000);
}
function isEnter(e) { return e.key === 'Enter' && !e.isComposing && e.keyCode !== 229; }

/* =========================================================
   상태
   ========================================================= */
function blankState() {
  return { v: 1, updatedAt: 0, tags: { members: [], games: [], areas: [], foods: DEFAULT_FOODS.map(n => ({ id: uid(), name: n })) }, records: [] };
}
function normTag(t) { return t && typeof t === 'object' && t.id && t.name ? { id: String(t.id), name: String(t.name), ...(t.hidden ? { hidden: true } : {}) } : null; }
function normRec(r) {
  if (!r || typeof r !== 'object' || !r.id) return null;
  const arr = a => Array.isArray(a) ? a.map(String) : [];
  const f = r.food && typeof r.food === 'object' ? r.food : {};
  return {
    id: String(r.id), type: r.type === 'special' ? 'special' : 'meet',
    date: /^\d{4}-\d{2}-\d{2}$/.test(r.date || '') ? r.date : today(),
    title: String(r.title || ''),
    members: arr(r.members), guests: Math.max(0, parseInt(r.guests, 10) || 0),
    area: String(r.area || ''), place: String(r.place || ''),
    games: arr(r.games),
    food: { cat: String(f.cat || ''), name: String(f.name || ''), menu: String(f.menu || '') },
    note: String(r.note || ''), memory: String(r.memory || ''),
    photos: Array.isArray(r.photos) ? r.photos.filter(p => p && p.id).map(p => ({ id: String(p.id), w: +p.w || 0, h: +p.h || 0, size: +p.size || 0 })) : [],
    createdAt: +r.createdAt || 0, updatedAt: +r.updatedAt || 0
  };
}
function normState(o) {
  const s = blankState();
  if (!o || typeof o !== 'object') return s;
  s.updatedAt = +o.updatedAt || 0;
  const tg = o.tags || {};
  for (const k of Object.keys(KINDS)) if (Array.isArray(tg[k])) s.tags[k] = tg[k].map(normTag).filter(Boolean);
  s.records = Array.isArray(o.records) ? o.records.map(normRec).filter(Boolean) : [];
  return s;
}
function loadState() {
  const raw = getLS(LS_STATE);
  if (!raw) return blankState();
  try { return normState(JSON.parse(raw)); } catch (e) { return blankState(); }
}
// 공유 링크(?v=ID)로 들어오면 그 ID로 보기 전용 연결
(function () {
  try {
    const v = new URLSearchParams(location.search).get('v');
    if (!v) return;
    const id = norm(v).replace(/[\/\s]/g, '');
    if (id && getLS(LS_SYNC) !== id) { setLS(LS_SYNC, id); delLS(LS_ADMIN_HINT); }
  } catch (e) {}
})();
// 역할: local(동기화 없음, 이 기기에서 자유롭게) / admin(관리자 로그인) / viewer(보기 전용)
let ROLE = !getLS(LS_SYNC) ? 'local' : (getLS(LS_ADMIN_HINT) === '1' ? 'admin' : 'viewer');
function canEdit() { return ROLE !== 'viewer'; }
function loadViewCache() {
  try { const o = JSON.parse(getLS(LS_VIEW) || 'null'); if (o && o.id === getLS(LS_SYNC)) return normState(o.state); } catch (e) {}
  const b = blankState(); b.records = []; return b;
}
// 보기 전용일 땐 관리자 기기의 원본(LS_STATE)을 건드리지 않도록 따로 캐시
let S = ROLE === 'viewer' ? loadViewCache() : loadState();
function saveLocal() {
  const ok = ROLE === 'viewer' ? setLS(LS_VIEW, JSON.stringify({ id: getLS(LS_SYNC), state: S })) : setLS(LS_STATE, JSON.stringify(S));
  if (!ok) toast('⚠ 저장 공간 부족', 3000);
}
function applyRoleUI() { document.body.classList.toggle('viewer', ROLE === 'viewer'); }
function commit(opts) {
  if (!canEdit()) { toast('보기 전용 계정(수정 불가)'); return; }
  S.updatedAt = Date.now();
  saveLocal(); pushCloud(); renderAll();
}
function tagList(kind) { return S.tags[kind] || []; }
function tagById(kind, id) { return tagList(kind).find(t => t.id === id); }
function tagName(kind, id) { const t = tagById(kind, id); return t ? t.name : '(삭제된 항목)'; }
function findTagByName(kind, name) { const n = norm(name).toLowerCase(); return tagList(kind).find(t => t.name.toLowerCase() === n); }
function addTag(kind, name) {
  name = norm(name); if (!name) return null;
  const ex = findTagByName(kind, name);
  if (ex) { if (ex.hidden) delete ex.hidden; return ex; }
  const t = { id: uid(), name }; S.tags[kind].push(t); return t;
}
function recById(id) { return S.records.find(r => r.id === id); }
function cmpAsc(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt - b.createdAt); }
function cmpDesc(a, b) { return -cmpAsc(a, b); }
function numbering() {
  const m = {}; S.records.filter(r => r.type === 'meet').sort(cmpAsc).forEach((r, i) => m[r.id] = i + 1); return m;
}
function headCount(r) { return r.members.length + r.guests; }
function allPids(st) { const out = []; (st || S).records.forEach(r => r.photos.forEach(p => out.push(p.id))); return out; }
function usageOf(kind, id) {
  let n = 0;
  for (const r of S.records) {
    if (kind === 'members' && r.members.includes(id)) n++;
    else if (kind === 'games' && r.games.includes(id)) n++;
    else if (kind === 'areas' && r.area === id) n++;
    else if (kind === 'foods' && r.food.cat === id) n++;
  }
  return n;
}
function recTitle(r, nums) {
  if (r.type === 'special') return r.title || '특별 일정';
  return '제' + ((nums || numbering())[r.id] || '?') + '회 무념무상 모임';
}
function placeText(r) {
  const a = r.area ? tagName('areas', r.area) : '';
  return [a, r.place].filter(Boolean).join(' · ');
}

/* =========================================================
   사진 저장소 (IndexedDB 캐시 + Firestore 하위 컬렉션)
   ========================================================= */
const IDB = {
  p: null, mem: new Map(), broken: false,
  open() {
    if (this.p) return this.p;
    this.p = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('bg_photos', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('p', { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    }).catch(e => { this.broken = true; return null; });
    return this.p;
  },
  async run(mode, fn) {
    const db = await this.open();
    if (!db) return fn(null);
    return new Promise((res, rej) => {
      let req;
      try {
        const tx = db.transaction('p', mode);
        req = fn(tx.objectStore('p'));
        tx.oncomplete = () => res(req && 'result' in req ? req.result : undefined);
        tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
      } catch (e) { rej(e); }
    });
  },
  async get(id) { if (this.broken) return this.mem.get(id) || null; try { return (await this.run('readonly', s => s.get(id))) || null; } catch (e) { return this.mem.get(id) || null; } },
  async put(o) { if (this.broken) { this.mem.set(o.id, o); return; } try { await this.run('readwrite', s => s.put(o)); } catch (e) { this.mem.set(o.id, o); } },
  async del(id) { this.mem.delete(id); if (this.broken) return; try { await this.run('readwrite', s => s.delete(id)); } catch (e) {} },
  async keys() { if (this.broken) return Array.from(this.mem.keys()); try { return (await this.run('readonly', s => s.getAllKeys())) || []; } catch (e) { return []; } }
};
const Photos = {
  uploading: false,
  col() { return syncRef ? syncRef.collection('photos') : null; },
  async get(pid) {
    const loc = await IDB.get(pid);
    if (loc && loc.data) return loc.data;
    const col = this.col();
    if (!col) return null;
    try {
      const s = await col.doc(pid).get();
      if (s.exists) { const d = s.data() || {}; if (d.d) { await IDB.put({ id: pid, data: d.d, rid: d.rid || '' }); return d.d; } }
    } catch (e) {}
    return null;
  },
  async saveNew(pid, data, rid) {
    await IDB.put({ id: pid, data, rid });
    setList(LS_PUP, getList(LS_PUP).concat(pid));
  },
  remove(pids) {
    if (!pids || !pids.length) return;
    const up = getList(LS_PUP).filter(p => !pids.includes(p)); setList(LS_PUP, up);
    pids.forEach(p => IDB.del(p));
    if (getLS(LS_SYNC)) setList(LS_PDEL, getList(LS_PDEL).concat(pids));
    this.flush();
  },
  pendingCount() { return getList(LS_PUP).length; },
  async flush() {
    const col = this.col();
    if (!col || this.uploading || ROLE !== 'admin') return;
    this.uploading = true; updateSyncPill();
    try {
      // 1) 삭제 대기
      for (const pid of getList(LS_PDEL)) {
        try { await col.doc(pid).delete(); setList(LS_PDEL, getList(LS_PDEL).filter(x => x !== pid)); } catch (e) { break; }
      }
      // 2) 업로드 대기
      const ref = new Set(allPids());
      for (const pid of getList(LS_PUP)) {
        if (!ref.has(pid)) { setList(LS_PUP, getList(LS_PUP).filter(x => x !== pid)); continue; }
        const loc = await IDB.get(pid);
        if (!loc || !loc.data) { setList(LS_PUP, getList(LS_PUP).filter(x => x !== pid)); continue; }
        try {
          await col.doc(pid).set({ d: loc.data, rid: loc.rid || '', at: Date.now() });
          setList(LS_PUP, getList(LS_PUP).filter(x => x !== pid));
          updateSyncPill();
        } catch (e) { onWriteError(e); break; }
      }
    } finally { this.uploading = false; updateSyncPill(); if (curView === 'settings') renderSettings(); }
  },
  async prune() {
    if (ROLE === 'viewer') return;
    const ref = new Set(allPids()); const up = new Set(getList(LS_PUP));
    for (const k of await IDB.keys()) if (!ref.has(k) && !up.has(k)) IDB.del(k);
  }
};

async function loadPhotoInto(el, pid) {
  el.classList.add('loading'); el.classList.remove('missing');
  const old = el.querySelector('img'); if (old) old.remove();
  const span = el.querySelector('.msg'); if (span) span.remove();
  const data = await Photos.get(pid);
  if (!el.isConnected) return;
  el.classList.remove('loading');
  if (data) {
    const img = new Image(); img.alt = ''; img.src = data; el.prepend(img);
  } else {
    el.classList.add('missing');
    const m = document.createElement('span'); m.className = 'msg';
    m.textContent = syncRef ? '업로드 실패\n탭해서 다시' : '이 기기에 없음';
    m.style.whiteSpace = 'pre-line'; m.style.padding = '6px'; el.appendChild(m);
  }
}

function loadImgSrc(src, revoke) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { res(img); if (revoke) setTimeout(() => URL.revokeObjectURL(src), 2000); };
    img.onerror = () => { if (revoke) URL.revokeObjectURL(src); rej(new Error('decode')); };
    img.src = src;
  });
}
function readAsDataURL(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
}
// 미리보기/앱 내 브라우저처럼 blob: 이미지를 막는 환경이 있어서, URL 없이 바로 디코딩하는 방법부터 시도
async function decodeImage(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { try { return await createImageBitmap(file); } catch (e2) {} }
  }
  try { return await loadImgSrc(await readAsDataURL(file), false); } catch (e) {}
  return await loadImgSrc(URL.createObjectURL(file), true);
}
async function shrinkPhoto(file) {
  const img = await decodeImage(file);
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  if (!w0 || !h0) throw new Error('size');
  let scale = Math.min(1, PHOTO_EDGE / Math.max(w0, h0)), q = 0.78, out = null;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  for (let i = 0; i < 8; i++) {
    const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
    c.width = w; c.height = h;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    const data = c.toDataURL('image/jpeg', q);
    out = { data, w, h, size: data.length };
    if (data.length <= PHOTO_MAX_CHARS) { if (img.close) try { img.close(); } catch (e) {} return out; }
    if (q > 0.62) q -= 0.08; else scale *= 0.82;
  }
  if (img.close) try { img.close(); } catch (e) {}
  if (out && out.size <= 1000000) return out;
  throw new Error('big');
}

function recordHay(r) {
  const parts = [r.title, r.place, r.note, r.memory, r.food.name, r.food.menu,
    r.area ? tagName('areas', r.area) : '', r.food.cat ? tagName('foods', r.food.cat) : '',
    ...r.members.map(id => tagName('members', id)), ...r.games.map(id => tagName('games', id))];
  return parts.join(' ').toLowerCase();
}
function filteredRecords() {
  let rs = S.records.slice();
  if (F.type !== 'all') rs = rs.filter(r => r.type === F.type);
  if (F.year !== 'all') rs = rs.filter(r => r.date.startsWith(F.year));
  if (F.extra) rs = rs.filter(F.extra.test);
  const q = F.q.trim().toLowerCase();
  if (q) { const ws = q.split(/\s+/); rs = rs.filter(r => { const h = recordHay(r); return ws.every(w => h.includes(w)); }); }
  return rs.sort(cmpDesc);
}

(function () {
  const v = $('#viewer'); let sx = 0, sy = 0, down = false;
  v.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; down = true; sx = e.clientX; sy = e.clientY; });
  v.addEventListener('pointerup', e => {
    if (!down) return; down = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { vIdx += dx < 0 ? 1 : -1; showV(); }
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeViewer();
  });
  v.addEventListener('pointercancel', () => { down = false; });
  document.addEventListener('keydown', e => {
    if (!v.classList.contains('show')) return;
    if (e.key === 'ArrowLeft') { vIdx--; showV(); } else if (e.key === 'ArrowRight') { vIdx++; showV(); }

function suggestions(kind) {
  // kind: 'place' | 'food'
  const cnt = new Map();
  for (const r of S.records) {
    if (D.id && r.id === D.id) continue;
    if (kind === 'place') {
      if (!r.place) continue; if (D.area && r.area !== D.area) continue;
      const k = r.area + '\u0001' + r.place; cnt.set(k, (cnt.get(k) || 0) + 1);
    } else {
      if (r.type !== 'meet' || !r.food.name) continue; if (D.food.cat && r.food.cat !== D.food.cat) continue;
      const k = r.food.cat + '\u0001' + r.food.name; cnt.set(k, (cnt.get(k) || 0) + 1);
    }
  }
  return Array.from(cnt.entries()).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([k, n]) => { const [g, v] = k.split('\u0001'); return { g, v, n }; });

  return `<div class="card">` + arr.map(([g, o]) => {
    const items = Array.from(o.items.entries()).sort((a, b) => b[1] - a[1]);
    return `<details class="grp"><summary><span>${esc(g ? tagName(kind, g) : '(미지정)')}</span><span class="c">${o.n}번</span></summary>

    if (!firebase.auth) throw { code: 'load' };
    if (!firebase.apps.length) firebase.initializeApp(BAKED_CFG);
    const cred = await firebase.auth().signInWithEmailAndPassword(em, pw);
    const ok = await checkAdmin(firebase.firestore(), cred.user);
    if (!ok) {
      await firebase.auth().signOut();
      if (btn) btn.disabled = false;
      dlg({ title: '아직 관리자로 등록 안 된 계정', msg: '로그인은 성공했으나, 관리자 목록에 없음.\n룰루에게 문의!(콘솔 조작 필요)', input: { value: cred.user.uid } });
      return;
    }
    setLS(LS_ADMIN_HINT, '1');
    toast('관리자 로그인 성공!');
    setTimeout(() => location.reload(), 500);
  } catch (e) {
    if (btn) btn.disabled = false;
    dlg({ title: '로그인 실패', msg: authMsg(e) });
  }
}
async function adminLogout() {
  const ok = await confirmDlg('로그아웃', '로그아웃 시, 이 기기는 조회 전용으로 전환 예정.\n저장된 기록은 그대로 유지 예정.', '로그아웃');
  if (!ok) return;
  try { await firebase.auth().signOut(); } catch (e) {}
  setLS(LS_ADMIN_HINT, '0'); location.reload();
}
function shareUrl() { return location.origin + location.pathname + '?v=' + encodeURIComponent(getLS(LS_SYNC) || ''); }
async function copyShare() {
  const url = shareUrl();
  try { await navigator.clipboard.writeText(url); toast('공유 링크 복사 완료. 붙여넣기로 공유 가능!', 2600); }
  catch (e) { dlg({ title: '공유 링크', msg: '아래 주소를 길게 눌러 복사 가능.', input: { value: url } }); }
}
/* ---------- 아이폰 홈 화면 앱 로그인 풀림 대응 ----------
   iOS 홈 화면 앱은 백그라운드에 갔다 오면 IndexedDB(로그인 정보 저장소) 연결이 끊겨서
   Firebase가 조용히 로그아웃 상태가 되는 경우가 있음 → 저장이 permission-denied로 거절됨.
   새로 불러오면 저장소 연결이 다시 붙고 로그인도 복구되므로, 그때 한 번 자동으로 다시 불러옴. */
let writeRetried = false;
function recoverAuth() {
  if (ROLE !== 'admin') return false;
  let last = 0; try { last = +sessionStorage.getItem('bg_recover_at') || 0; } catch (e) {}
  if (Date.now() - last < 60000) return false;          // 1분 안에 또 새로고침하지 않기 (무한 반복 방지)
  try { sessionStorage.setItem('bg_recover_at', String(Date.now())); } catch (e) {}
  toast('로그인 확인 중~', 3000);
  setTimeout(() => location.reload(), 300);
  return true;
}
function onWriteError(e) {
  const code = e && e.code;
  if (code === 'permission-denied' && ROLE === 'admin' && window.firebase && firebase.auth) {
    const u = firebase.auth().currentUser;
    if (!u) { if (recoverAuth()) return; }
    else if (!writeRetried) {                            // 로그인은 살아 있으면: 토큰만 새로 받아서 한 번 더 시도
      writeRetried = true;
      u.getIdToken(true).then(() => setTimeout(() => { pushCloud(); Photos.flush(); }, 0)).catch(() => setSync('error', code));
      return;
    }
  }
  setSync('error', code);
}
function watchAuth() {
  if (!window.firebase || !firebase.auth) return;
  firebase.auth().onAuthStateChanged(u => {
    authUser = u;
    if (ROLE === 'admin' && !u && document.visibilityState === 'visible') recoverAuth();
  });
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || ROLE !== 'admin' || !syncRef || !window.firebase || !firebase.auth) return;
  const u = firebase.auth().currentUser;
  if (!u) { recoverAuth(); return; }
  u.getIdToken(true).then(() => { if (syncState === 'error') { writeRetried = false; pushCloud(); Photos.flush(); } }).catch(() => {});
});
window.addEventListener('online', () => Photos.flush());
async function syncOn() {
  const id = norm($('#syncIn').value).replace(/[\/\s]/g, '');
  if (!id) { toast('동기화 ID 입력 필요'); $('#syncIn').focus(); return; }
  setLS(LS_SYNC, id);
  toast('연결 중~');
  setTimeout(() => location.reload(), 500);
}
async function syncOff() {
  const ok = await confirmDlg(ROLE === 'viewer' ? '연결 끊기' : '동기화 끄기', ROLE === 'viewer' ? '이 기기에서 공유된 기록 조회 중단.\n다시 보려면 공유 링크로 접속 필요.' : '이 기기에서만 동기화 중단.\n기록은 이 기기에 그대로 유지 예정.', ROLE === 'viewer' ? '끊기' : '끄기', true);
  if (!ok) return;
  const wasViewer = ROLE === 'viewer';
  delLS(LS_SYNC); delLS(LS_ADMIN_HINT); if (wasViewer) delLS(LS_VIEW);
  location.replace(location.origin + location.pathname);   // ?v= 링크로 다시 붙지 않게 주소에서 제거
}

/* =========================================================
   클릭 처리
   ========================================================= */
const ACT = {
  nav: el => setView(el.dataset.v),
  newRec: async () => {
    const t = await dlg({ title: '기록 유형 선택', horizontal: false, buttons: [
      { label: '🎲 보드게임', val: 'meet', kind: 'primary' },
      { label: '🎉 특별 일정', val: 'special', kind: 'accent' },
      { label: '취소', val: null }] });
    if (t) openNewForm(t);
  },
  open: el => openDetail(el.dataset.id),
  detailClose: () => closeDetail(),
  edit: () => { if (detailId) openEditForm(detailId); },
  del: async () => {
    const r = recById(detailId); if (!r) return;
    const ok = await confirmDlg('삭제 확인', `${recTitle(r)} (${fmtDate(r.date)})${r.photos.length ? `\n사진 ${r.photos.length}장도 같이 삭제 예정.` : ''}\n지운 기록은 복구 불가.`, '삭제', true);
    if (!ok) return;
    const pids = r.photos.map(p => p.id);
    S.records = S.records.filter(x => x.id !== r.id);
    closeDetail(); commit(); Photos.remove(pids); toast('삭제 완료');
  },
  fType: el => { F.type = el.dataset.v; renderList(); },
  fClear: () => { F.extra = null; renderList(); },
  pick: el => togglePick(el.dataset.kind, el.dataset.id),
  pickAdd: el => { const prev = addingKind; addingKind = el.dataset.kind; if (prev && prev !== addingKind) refreshPicker(prev); refreshPicker(addingKind); },
  pickAddOk: el => confirmPickAdd(el.dataset.kind),
  pickAddCancel: () => { const k = addingKind; addingKind = null; if (k) refreshPicker(k); },
  sug: el => {
    const k = el.dataset.k, g = el.dataset.g, v = el.dataset.v;
    if (k === 'place') { D.place = v; $('#f-place').value = v; if (g && D.area !== g) { D.area = g; refreshPicker('areas'); refreshSug('place'); } }
    else { D.food.name = v; $('#f-fname').value = v; if (g && D.food.cat !== g) { D.food.cat = g; refreshPicker('foods'); refreshSug('food'); } }
  },
  guest: el => { D.guests = Math.max(0, D.guests + (+el.dataset.d)); updateFormCounts(); },
  addPhoto: () => { if (D && D.photos.length >= MAX_PHOTOS) { toast(`사진은 ${MAX_PHOTOS}장까지만 가능`); return; } $('#photoInput').click(); },
  rmPhoto: (el, e) => { e.stopPropagation(); D.photos = D.photos.filter(p => p.id !== el.dataset.pid); renderFormPhotos(); },
  formClose: () => tryCloseForm(),
  formSave: () => saveForm(),
  viewPhoto: el => {
    if (el.classList.contains('missing')) { loadPhotoInto(el, el.dataset.pid); return; }
    if (el.classList.contains('loading')) return;
    openViewer(detailPhotos.map(id => ({ id })), +el.dataset.i);
  },
  vClose: () => closeViewer(), vPrev: () => { vIdx--; showV(); }, vNext: () => { vIdx++; showV(); },
  vSave: () => { const src = $('#vImg').src; if (!src || !src.startsWith('data:')) return; const a = document.createElement('a'); a.href = src; a.download = `무념무상_사진_${vIdx + 1}.jpg`; document.body.appendChild(a); a.click(); a.remove(); },
  stYear: el => { ST.year = el.dataset.v; renderStats(); },
  stIncl: el => { ST.inclSp = el.checked; renderStats(); },
  stMore: el => { ST.more[el.dataset.k] = !ST.more[el.dataset.k]; renderStats(); },
  statGo: el => statGo(el),
  setKind: el => { setKind = el.dataset.v; renderSettings(); },
  tagNew: () => settingsAddTag(),
  tagRename: el => renameTag(el.dataset.id),
  tagDel: el => deleteTag(el.dataset.id),
  tagRestore: el => { const t = tagById(setKind, el.dataset.id); if (t) { delete t.hidden; commit(); } },
  syncOn: () => syncOn(), syncOff: () => syncOff(), syncRetry: () => Photos.flush(),
  adminLogin: () => adminLogin(), adminLogout: () => adminLogout(), copyShare: () => copyShare(),
  reconnect: () => location.reload(),
  backup: el => doBackup(el.dataset.photos === '1'),
  restore: () => $('#restoreInput').click(),
  excel: () => doExcel(),
  reset: () => doReset()
};
const EDIT_ACTS = new Set(['newRec', 'edit', 'del', 'formSave', 'pick', 'pickAdd', 'pickAddOk', 'addPhoto', 'rmPhoto', 'tagNew', 'tagRename', 'tagDel', 'tagRestore', 'backup', 'restore', 'reset', 'setKind']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (EDIT_ACTS.has(el.dataset.act) && !canEdit()) { e.preventDefault(); toast('조회 전용이라 수정 불가'); return; }
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { fn(el, e); return; }
  e.preventDefault(); fn(el, e);
});
document.addEventListener('keydown', e => {
  if (!isEnter(e)) return;
  if (e.target.id === 'setAddIn') { e.preventDefault(); settingsAddTag(); }
  else if (e.target.id === 'syncIn') { e.preventDefault(); syncOn(); }
  else if (e.target.id === 'admEmail') { e.preventDefault(); const pw = $('#admPw'); if (pw) pw.focus(); }
  else if (e.target.id === 'admPw') { e.preventDefault(); adminLogin(); }
});

/* =========================================================
   PWA (아이콘은 canvas로, manifest는 Blob URL)
   ========================================================= */
function drawIcon(size) {
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
  // 배경: 하늘색(왼쪽 아래) → 분홍(오른쪽 위) 대각선 그라데이션 + 노란빛
  const g = x.createLinearGradient(0, size, size, 0);
  g.addColorStop(0, '#b9dcf5'); g.addColorStop(0.55, '#f2cfe0'); g.addColorStop(1, '#f9c7d3');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  const y = x.createRadialGradient(size * 0.18, size * 0.16, 0, size * 0.18, size * 0.16, size * 0.62);
  y.addColorStop(0, 'rgba(255,236,160,.95)'); y.addColorStop(0.45, 'rgba(255,236,160,.45)'); y.addColorStop(1, 'rgba(255,236,160,0)');
  x.fillStyle = y; x.fillRect(0, 0, size, size);
  // 주사위 (이모지 글꼴은 기기마다 canvas에 안 그려지는 경우가 있어서 도형으로 직접 그림)
  drawDice(x, size * 0.5125, size * 0.495, size * 0.27, size);
  return c.toDataURL('image/png');
}
function drawDice(x, cx, cy, a, size) {
  const k = Math.cos(Math.PI / 6) * a;
  const T = [cx, cy - a], UL = [cx - k, cy - a / 2], UR = [cx + k, cy - a / 2], C = [cx, cy],
        LL = [cx - k, cy + a / 2], LR = [cx + k, cy + a / 2], B = [cx, cy + a];
  const poly = pts => { x.beginPath(); x.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => x.lineTo(p[0], p[1])); x.closePath(); };
  // 둥근 외곽 + 그림자
  x.save();
  x.shadowColor = 'rgba(60,70,110,.25)'; x.shadowBlur = size * 0.06; x.shadowOffsetY = size * 0.025;
  x.lineJoin = 'round'; x.lineWidth = a * 0.22; x.strokeStyle = x.fillStyle = '#d3d6df';
  poly([T, UR, LR, B, LL, UL]); x.fill(); x.stroke();
  x.restore();
  // 면: 원점 O, 변 벡터 u, v 로 단위 정사각형을 면에 맞춤
  const face = (O, P, Q, col, pips, pipCol, pr) => {
    x.save();
    x.setTransform(P[0] - O[0], P[1] - O[1], Q[0] - O[0], Q[1] - O[1], O[0], O[1]);
    x.fillStyle = col; x.fillRect(0, 0, 1, 1);
    x.fillStyle = pipCol;
    pips.forEach(([px, py]) => { x.beginPath(); x.arc(px, py, pr, 0, Math.PI * 2); x.fill(); });
    x.restore();
  };
  face(UL, T, C, '#ffffff', [[0.5, 0.5]], '#ef5a4c', 0.17);                                   // 윗면: 빨간 점 1
  face(UL, C, LL, '#eef0f4', [[0.28, 0.28], [0.72, 0.72]], '#34363d', 0.11);                  // 왼면: 2
  face(C, UR, B, '#dfe2e9', [[0.74, 0.26], [0.5, 0.5], [0.26, 0.74]], '#34363d', 0.11);       // 오른면: 3
  // 윗면 하이라이트
  x.save(); x.globalAlpha = .55; x.strokeStyle = '#ffffff'; x.lineWidth = a * 0.05; x.lineCap = 'round';
  x.beginPath(); x.moveTo(UL[0] + k * 0.25, UL[1] - a * 0.08); x.lineTo(T[0] - k * 0.2, T[1] + a * 0.16); x.stroke(); x.restore();
}
(function setupPWA() {
  try {
    const i192 = drawIcon(192), i512 = drawIcon(512);
    $('#logoImg').src = drawIcon(128);
    const at = document.createElement('link'); at.rel = 'apple-touch-icon'; at.href = drawIcon(180); document.head.appendChild(at);
    const fi = document.createElement('link'); fi.rel = 'icon'; fi.href = i192; document.head.appendChild(fi);
    const base = location.origin + location.pathname;
    const sid = getLS(LS_SYNC);
    const start = ROLE === 'viewer' && sid ? base + '?v=' + encodeURIComponent(sid) : base;
    const mf = { name: '무념무상', short_name: '무념무상', start_url: start, scope: base.replace(/[^/]*$/, ''), display: 'standalone',
      background_color: '#f2f3f5', theme_color: '#ffffff',
      icons: [{ src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png' }] };
    const l = document.createElement('link'); l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
    document.head.appendChild(l);
  } catch (e) {}
})();

/* =========================================================

applyRoleUI(); renderHeader(); setView('list'); initSync();
